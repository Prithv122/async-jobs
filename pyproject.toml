[project]
name = "async-jobs"
version = "0.1.0"
description = "Upload to background worker (arq/Redis) with status polling and webhooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend —
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
async-jobs = "asyncjobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠️ When /new-project renames src/app, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/asyncjobs"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
